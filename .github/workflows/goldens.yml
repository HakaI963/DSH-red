# One-shot helper to re-record Flutter golden PNGs after deliberate UI changes.
# Dispatch it manually, then apply the artifact:
#   gh run download <run-id> -n goldens-pending --dir /tmp/goldens
#   tar -C . -xf /tmp/goldens/goldens.tar   (then commit the PNGs)
# It only touches goldens whose tests ran with --update-goldens below.
name: Golden update

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
  NOTO_CJK_VERSION: 1:20230817+repack1-3
  NOTO_EMOJI_VERSION: v2.051

jobs:
  update:
    name: Re-record goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Same fonts the golden jobs use (ci.yml): matching glyph metrics or every
      # re-recorded PNG differs from the baseline for font reasons alone.
      - name: Restore the fonts the goldens were drawn with
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
      - name: Save the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}
      - name: Install the fonts
        run: |
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: Re-record
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub --update-goldens \
            test/settings/settings_ia_golden_test.dart \
            test/shell/shell_golden_test.dart \
            test/plugins/seats/seats_pages_test.dart \
            test/launch/launch_golden_test.dart \
            test/phone/phone_golden_test.dart \
            test/phone/dnd_mode_golden_test.dart \
            test/settings/icon_shortcut_sheet_test.dart \
            test/share/share_card_golden_test.dart \
            test/settings/appearance_page_test.dart \
            test/settings/launch_screen_section_test.dart \
            test/settings/settings_pages_golden_test.dart \
            test/settings/wallpaper_section_test.dart \
            test/features/features_pages_test.dart \
            test/plugin_config/plugin_config_golden_test.dart \
            test/integration/wiring_test.dart
      - name: Package changed goldens
        run: |
          git -c core.quotepath=off diff --name-only HEAD -- 'app/test' > changed.txt
          tar -cf goldens.tar --null -T <(sed 's|^|./|' changed.txt | tr '\n' '\0') || true
          echo "re-recorded: $(wc -l < changed.txt) files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-pending
          path: goldens.tar
