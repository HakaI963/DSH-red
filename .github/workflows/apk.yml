# Builds the release APK on GitHub-hosted runners so no local Gradle/NDK/Flutter
# toolchain is ever needed. Pushes to main build arm64 (the phone flavor);
# workflow_dispatch can pick arm64, x64 or both. The APK is uploaded as a
# workflow artifact. Without key.properties the release build falls back to the
# debug signing key (see app/android/app/build.gradle.kts), which installs fine
# for testing; add signing secrets later for store-distributable builds.
name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'ABI flavor to build'
        type: choice
        options: [arm64, x64, all]
        default: arm64

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  # The Aliyun mirrors are slow and unreliable from GitHub-hosted runners.
  DSH_MAVEN_MIRRORS: 0

jobs:
  build:
    name: Release APK (${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'arm64' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter packages and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so Gradle comes from here; the wrapper the
      # Flutter tool insists on is generated from it before the build.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Generate the Gradle wrapper
        working-directory: app/android
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon
      # The APK must contain the PRoot Linux runtime (runtime/build-runtime.sh
      # writes runtime/out/<abi>/assets+jniLibs, which the gradle flavors pick
      # up). Without this step the app boots with "bundled runtime is
      # incomplete". Downloads are hash-pinned; single ABI per run.
      - name: Build bundled runtime
        timeout-minutes: 45
        env:
          # GitHub-hosted runners: the official Ubuntu archives keep every pool
          # file; the China mirrors occasionally serve a Packages index a few
          # minutes ahead of the pool sync and 404 fresh deb revisions.
          UBUNTU_ARCHIVE_AMD64: https://archive.ubuntu.com/ubuntu
          UBUNTU_ARCHIVE_ARM64: https://ports.ubuntu.com/ubuntu-ports
          # npmmirror/tuna/npmjs: use whichever answers — the China mirrors had
          # a multi-hour database outage (E500) that killed CI and runtime builds.
          UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
          NODE_MIRROR: https://nodejs.org/dist
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          flavor="${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'arm64' }}"
          case "$flavor" in
            arm64) runtime_abis=(arm64-v8a) ;;
            x64) runtime_abis=(x86_64) ;;
            all) runtime_abis=(x86_64 arm64-v8a) ;;
            *) echo "bad flavor $flavor" >&2; exit 1 ;;
          esac
          runtime/build-runtime.sh "${runtime_abis[@]}"
      - name: Build release APK
        run: tooling/build-apk.sh -f "${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'arm64' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-red-apk-${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'arm64' }}-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      # A v* tag pushes the APKs onto a GitHub Release as published downloads.
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DSH-red ${GITHUB_REF_NAME}" \
            --notes "English build of DSH Go (DeepSeek Harness for Android). Release APK built by GitHub Actions; debug-signed (add signing secrets to the repo for store-ready builds). Install over any earlier build of the same version." \
            app/build/app/outputs/flutter-apk/*.apk
