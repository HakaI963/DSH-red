# PR intake gate — the CI enforcement of CONTRIBUTING.md's "no external PRs for now".
# The logic lives in .github/scripts/pr-intake/; this file only orchestrates.
#
# pull_request_target is required to close PRs pushed from other repositories.
# It must check out the default branch; never check out the PR head, so fork
# code never runs in a trusted context.
#
# Not retroactive: it only listens to opened / reopened. A PR already open
# before the gate existed never receives `opened`, so it is not closed.
# A maintainer reopen counts as a one-time approval; anyone else's reopen is
# closed again.
name: PR Gate

on:
  pull_request_target:
    types: [opened, reopened]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-contributor:
    if: github.repository == 'ccch1mneyyy/dsh-Go'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check pull request intake policy
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const { join } = await import('node:path')
            const { runPrGate } = await import(pathToFileURL(join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/pr-intake/gate.mjs',
            )).href)
            await runPrGate({ github, context, core })
