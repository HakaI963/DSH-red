## dsh-go community forum (Discourse) container config · reverse-proxy mode
##
## For servers that already have a reverse proxy on 80/443 (nginx, Caddy, Traefik…):
## Discourse serves plain HTTP on localhost only, and TLS certs plus the 80→443 redirect are
## handled by the existing proxy. On a dedicated server where Discourse issues its own certs,
## use app.yml in this directory instead.
##
## Usage: copy to /var/discourse/containers/app.yml (the file name decides the container name;
## the scripts under infra/forum/scripts/ look for a container named app by default), then
##   cd /var/discourse && ./launcher rebuild app
## Proxy-side configuration examples: docs/forum/deploy.md, section "3B reverse-proxy mode".
##
## Every value you must fill is marked <<FILL: hint>>. YAML is indentation-sensitive: change only the text inside quotes.

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  ## Default: hand off to the existing proxy over a unix socket (the officially recommended setup).
  ## nginx inside the container listens on /shared/nginx.http.sock instead,
  ## which maps to /var/discourse/shared/standalone/nginx.http.sock on the host,
  ## and it trusts the X-Real-IP sent by the peer (your proxy) so rate limits and logs see the visitor's real IP.
  - "templates/web.socketed.template.yml"
  ## Do not add web.ssl / web.letsencrypt.ssl: TLS terminates at your existing proxy.

## Socket mode needs no exposed ports.
## To use port mode instead (your proxy cannot reach a unix socket, or runs in another container):
##   1. delete the web.socketed line above;
##   2. uncomment the two lines below — bind to 127.0.0.1 only, never expose Discourse directly;
##   3. point your existing proxy at http://127.0.0.1:8080.
#expose:
#  - "127.0.0.1:8080:80"

params:
  ## Chinese search is handled by Discourse per default_locale; keep the official default here
  db_default_text_search_config: "pg_catalog.english"

  ## PostgreSQL shared_buffers, officially no more than 25% of total RAM
  ##   2 GB: 256MB (default)    4 GB: 1024MB
  ##   15 GB shared with other services: 1024MB–2048MB (leave enough RAM for them)
  db_shared_buffers: "256MB"

  ## Upload size cap (client_max_body_size of the container's nginx).
  ## Your existing proxy's cap must be ≥ this; to restore by uploading a backup in the admin UI, raise it to e.g. 1024m
  #upload_size: 10m

  #version: latest

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8

  ## Site default language (pinned, not changeable in the admin UI); zh_CN auto-enables Chinese segmentation search and the zh_CN length defaults
  DISCOURSE_DEFAULT_LOCALE: zh_CN

  ## Web worker count, no more than CPU cores × 2
  ##   2 GB: 2    4 GB: 3–4    15 GB shared: 4 (up to 6 with more cores)
  UNICORN_WORKERS: 2

  ## Public hostname; must exactly match the domain configured on your existing proxy
  DISCOURSE_HOSTNAME: "<<FILL: forum domain, e.g. forum.dshtui.com>>"

  ## Visitors come over https (terminated by your existing proxy). This must stay on:
  ## it makes Discourse generate links, mail links and OAuth callbacks with https,
  ## and marks auth cookies Secure. The official web.letsencrypt.ssl template sets the same value.
  DISCOURSE_FORCE_HTTPS: true

  ## Admin emails (comma separated); accounts registered with these emails become admins automatically
  DISCOURSE_DEVELOPER_EMAILS: "<<FILL: your email>>"

  ## ── Email ─────────────────────────────────────────────────────────
  DISCOURSE_SMTP_ADDRESS: "<<FILL: SMTP server>>"
  DISCOURSE_SMTP_PORT: 587
  DISCOURSE_SMTP_USER_NAME: "<<FILL: SMTP username>>"
  DISCOURSE_SMTP_PASSWORD: "<<FILL: SMTP password>>"
  DISCOURSE_SMTP_ENABLE_START_TLS: true
  #DISCOURSE_SMTP_FORCE_TLS: true
  DISCOURSE_NOTIFICATION_EMAIL: "<<FILL: sender address, e.g. noreply@forum.dshtui.com>>"
  ## Until SMTP is ready you can skip the build-time email check (rebuild once it is filled in)
  #DISCOURSE_SKIP_EMAIL_SETUP: "1"

  #DISCOURSE_MAX_USER_API_REQS_PER_MINUTE: 50
  #DISCOURSE_MAX_USER_API_REQS_PER_DAY: 4000

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

## Plugins: oauth2-basic, openid-connect, solved, reactions and chat are built into core — do not clone them
hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/docker_manager.git

run:
  - exec: echo "Beginning of custom commands"
  ## In port mode, proxied requests arrive over the Docker bridge, so their source is the bridge gateway (172.x).
  ## Trusting X-Real-IP (nginx reads this header by default) from these private ranges lets rate limits and logs see the real visitor IP.
  ## Unused in socket mode and harmless to keep.
  - file:
      path: /etc/nginx/conf.d/outlets/server/15-real-ip-from-proxy.conf
      contents: |
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 192.168.0.0/16;
  - exec: echo "End of custom commands"
