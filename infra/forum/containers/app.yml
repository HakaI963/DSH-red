## dsh-go community forum (Discourse) container config
##
## Usage: place at /var/discourse/containers/app.yml, then
##   cd /var/discourse && ./launcher rebuild app
## Deployment steps: see docs/forum/deploy.md.
##
## Adapted from the official discourse_docker samples/standalone.yml (2026-10 version);
## defaults target a 2 GB-memory VPS; recommended 4 GB values are noted in the comment on the relevant line.
##
## Every value you must fill in is marked <<FILL: description>>; replace them all before rebuilding.
## YAML is indentation-sensitive: only change the values inside quotes, never the indentation.

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  ## HTTPS: Let's Encrypt issues and renews certificates automatically (ports 80/443 must be
  ## reachable from the public internet, and the domain's A record must already point at this server)
  - "templates/web.ssl.template.yml"
  - "templates/web.letsencrypt.ssl.template.yml"
  ## If a Cloudflare proxy (orange cloud) sits in front, uncomment the next line
  ## so rate limits count visitors' real IPs instead of Cloudflare's IPs
  #- "templates/cloudflare.template.yml"

expose:
  - "80:80" # http (Let's Encrypt validation + redirect to https)
  - "443:443" # https

params:
  ## Full-text search for a Chinese site is handled automatically by Discourse per default_locale
  ## (zh_CN uses jieba word segmentation + PostgreSQL's simple config); keep the official default here
  db_default_text_search_config: "pg_catalog.english"

  ## PostgreSQL shared buffers; the official advice is no more than 25% of total memory
  ##   2 GB: 256MB (default)    4 GB: 1024MB
  db_shared_buffers: "256MB"

  ## Per-connection sort memory; keep the default on small-memory machines
  #db_work_mem: "10MB"

  ## Version: follows latest by default (officially recommended; one-click upgrade in the web admin)
  #version: latest

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8

  ## Site default language. Once set via environment variable it cannot be changed in the admin
  ## (GlobalSetting overrides the site setting). With zh_CN, search automatically enables Chinese
  ## word segmentation, minimum search term of 1 character, Chinese defaults for minimum title/body length, etc.
  DISCOURSE_DEFAULT_LOCALE: zh_CN

  ## Number of web processes. Use 2 for 2 GB; 3–4 for 4 GB with 2+ cores
  UNICORN_WORKERS: 2

  ## Forum domain; must be a domain name, not an IP. Do not change it after going live
  ## (changing it requires a rebuild and migration)
  DISCOURSE_HOSTNAME: "<<FILL: forum domain, e.g. forum.dshtui.com>>"

  ## Admin emails (comma-separated). Accounts registered with these emails automatically become admins
  DISCOURSE_DEVELOPER_EMAILS: "<<FILL: your email>>"

  ## Let's Encrypt account email. Current official templates no longer read this variable
  ## (certificates are renewed automatically by acme.sh); kept only for compatibility with
  ## old templates — filling it in is optional
  LETSENCRYPT_ACCOUNT_EMAIL: "<<FILL: your email>>"

  ## ── Email (registration verification, notifications, and digests all depend on it) ─────────
  ## Most VPS providers block port 25; use 587 (STARTTLS) or 465 (implicit TLS)
  DISCOURSE_SMTP_ADDRESS: "<<FILL: SMTP server, e.g. email-smtp.ap-southeast-1.amazonaws.com>>"
  DISCOURSE_SMTP_PORT: 587
  DISCOURSE_SMTP_USER_NAME: "<<FILL: SMTP username>>"
  ## Keep the quotes if the password contains #
  DISCOURSE_SMTP_PASSWORD: "<<FILL: SMTP password>>"
  DISCOURSE_SMTP_ENABLE_START_TLS: true
  ## When using port 465, change to 465 and uncomment the next line
  #DISCOURSE_SMTP_FORCE_TLS: true
  ## Sender address; the domain must be verified with the email provider (SPF / DKIM)
  DISCOURSE_NOTIFICATION_EMAIL: "<<FILL: sender address, e.g. noreply@forum.dshtui.com>>"
  ## Only set the HELO domain if the provider requires it
  #DISCOURSE_SMTP_DOMAIN: "<<FILL: sending domain>>"

  ## ── App API rate limits (dsh-go accesses via User API Key) ──────────────────────────────
  ## Official defaults are 50 per minute / 4000 per day per key, plenty for the app; usually no need to change
  #DISCOURSE_MAX_USER_API_REQS_PER_MINUTE: 50
  #DISCOURSE_MAX_USER_API_REQS_PER_DAY: 4000

  ## Optional: MaxMind free geo database, used to show login regions in the admin
  #DISCOURSE_MAXMIND_ACCOUNT_ID: "<<FILL: MaxMind account ID>>"
  #DISCOURSE_MAXMIND_LICENSE_KEY: "<<FILL: MaxMind License Key>>"

## The container itself is stateless; all data (database, uploads, backups, certificates)
## lives in the host's shared directory
volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

## Plugins
## Already built into Discourse core — no need to install them here:
##   discourse-oauth2-basic (Gitee login), discourse-openid-connect (LINUX DO login),
##   discourse-solved ("solved" in the help category), discourse-reactions, chat
## Do not git clone the repositories above; they would conflict with the built-in versions.
hooks:
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - git clone https://github.com/discourse/docker_manager.git

## Commands executed after the build completes
run:
  - exec: echo "Beginning of custom commands"
  - exec: echo "End of custom commands"
