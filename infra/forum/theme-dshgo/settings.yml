download_url:
  type: string
  default: ""
  description: "Link for the “Get dsh-go” button (https). Leave empty to hide it."

landing_urls:
  type: list
  list_type: simple
  default: "https://go.dshtui.com/share/|https://ccch1mneyyy.github.io/dsh-go/share/"
  description: "Share landing page URL(s); keep in sync with shareLandingUrl in the app. Multiple allowed."

decorate_plain_text:
  type: bool
  default: true
  description: "Also detect dshgo://share/… written as plain text."
