# Categories, tags and UI text overrides. Written by scripts/apply_settings.rb, re-runnable:
# existing categories (matched by slug) only get permissions, color and the "solved" toggle
# synced; names and descriptions are left alone so you can fine-tune the copy in the admin UI later.

categories:
  - name: 公告
    slug: announcements
    color: "4D6BFE"
    text_color: "FFFFFF"
    description: 版本发布与社区通知
    # visible to everyone, only admins and moderators can post
    permissions: { everyone: readonly, staff: full }
    position: 0

  - name: 插件
    slug: plugins
    color: "25AAE2"
    text_color: "FFFFFF"
    description: 插件发布、推荐与评测，附分享码可在 dsh-go 一键安装
    position: 1

  - name: 配置分享
    slug: configs
    color: "12A89D"
    text_color: "FFFFFF"
    description: 模型、技能、工作区与自动化配置，附分享码一键导入
    position: 2

  - name: 玩法
    slug: tips
    color: "F7941D"
    text_color: "FFFFFF"
    description: 用法心得、实战案例与成果展示
    position: 3

  - name: 求助
    slug: help
    color: "E45735"
    text_color: "FFFFFF"
    description: 安装、连接、使用中遇到的问题
    # once enabled, the asker and moderators can mark one reply as the solution
    solved: true
    position: 4

  - name: 反馈
    slug: feedback
    color: "8C6238"
    text_color: "FFFFFF"
    description: Bug 报告与功能建议
    # every new site ships a "meta" category; repurpose it into this one instead of having two feedback categories
    reuse_site_setting: meta_category_id
    position: 5

# Topic tags. Only level-3 users and moderators may create new ones; everyone else picks from this list
tags:
  - 本机
  - 远程
  - 分享码
  - 技能
  - mcp
  - 自动化
  - 模型
  - 提示词
  - bug
  - 建议

# UI text overrides: the login button says LINUX DO instead of the plugin's default OpenID Connect
translation_overrides:
  zh_CN:
    js.login.oidc.name: "LINUX DO"
    js.login.oidc.title: "使用 LINUX DO 登录"
    js.login.oidc.message: "正在通过 LINUX DO 登录"
  en:
    js.login.oidc.name: "LINUX DO"
    js.login.oidc.title: "with LINUX DO"
    js.login.oidc.message: "Authenticating with LINUX DO"
