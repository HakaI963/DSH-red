# Sensitive settings template. Copy to secrets.yml and fill in; secrets.yml is in .gitignore and never enters the repo.
#   cp secrets.example.yml secrets.yml
#
# Login methods left empty will not be enabled (the script skips the matching enable_* flags and says so).
# After filling in, run scripts/apply.sh; re-run it whenever you change any item.

# ── GitHub (Discourse built-in) ──────────────────────────────────────────────
# callback URL: https://<forum domain>/auth/github/callback (dsh-go: https://forum.dshtui.com/auth/github/callback)
github_client_id: ""        # <<FILL: Client ID of the GitHub OAuth App>>
github_client_secret: ""    # <<FILL: Client Secret of the GitHub OAuth App (40 hex chars)>>

# ── LINUX DO Connect (OIDC) ─────────────────────────────────────────────────
# callback URL: https://<forum domain>/auth/oidc/callback (dsh-go: https://forum.dshtui.com/auth/oidc/callback)
openid_connect_client_id: ""      # <<FILL: Client ID of the LINUX DO Connect app>>
openid_connect_client_secret: ""  # <<FILL: Client Secret of the LINUX DO Connect app>>

# ── Gitee (oauth2-basic) ────────────────────────────────────────────────────
# callback URL: https://<forum domain>/auth/oauth2_basic/callback (dsh-go: https://forum.dshtui.com/auth/oauth2_basic/callback)
oauth2_client_id: ""        # <<FILL: Client ID of the Gitee third-party app>>
oauth2_client_secret: ""    # <<FILL: Client Secret of the Gitee third-party app>>

# ── Optional: move backups to an S3-compatible object store ─────────────────
# also set backup_location to s3 in site_settings.yml
s3_access_key_id: ""
s3_secret_access_key: ""
s3_region: ""               # e.g. ap-southeast-1
s3_backup_bucket: ""        # lowercase letters, digits, - and / only
s3_endpoint: ""             # empty for AWS; for Cloudflare R2 / Alibaba OSS etc. use an https:// endpoint
