# dsh-go forum site settings (non-sensitive part)
#
# Written by scripts/apply_settings.rb, re-runnable. Sensitive values (OAuth keys, S3 keys)
# belong in secrets.yml (copied from secrets.example.yml) and must not be committed.
#
# Syntax:
#   key: value                     overwrite directly
#   key: { add: [a, b] }           list-type setting: keep current values, append missing ones
#   group_list settings use group IDs joined by |: 1 admins · 2 moderators · 10–14 trust levels 0–4
#
# Every setting name was checked against Discourse main's config/site_settings.yml (2026-10).
# The default locale zh_CN is set via DISCOURSE_DEFAULT_LOCALE in containers/app.yml.
# Note: when the locale is pinned by environment variable, the database has no default_locale
# row and each setting's "locale default" is still computed from en (measured 2026.10: min
# title 15, min post 20, min search term 3), so the "zh_CN defaults" section below spells out
# the official zh_CN values one by one.

# ── Site identity ───────────────────────────────────────────────────────────
title: "<<FILL: forum name, e.g. dsh-go community>>"
site_description: "<<FILL: one-line intro used by search engines and share cards>>"
short_site_description: "<<FILL: shorter one-liner, may be the same as above>>"
contact_email: "<<FILL: public contact email>>"
# entity info referenced by the Terms-of-Service template; leave empty for solo operators, fill later in the admin UI
company_name: ""
governing_law: ""
city_for_disputes: ""

# ── zh_CN defaults (Discourse's official zh_CN values, see the header note) ──
# Chinese word segmentation (cppjieba); on by default when default_locale is active, set explicitly here
search_tokenize_chinese: true
min_search_term_length: 1
min_post_length: 8
min_first_post_length: 8
min_personal_message_post_length: 3
body_min_entropy: 3
min_topic_title_length: 6
title_min_entropy: 3
title_prettify: false
min_title_similar_length: 4
title_max_word_length: 50
post_excerpt_maxlength: 120
topic_excerpt_maxlength: 120
enable_inline_emoji_translation: true
digest_min_excerpt_length: 50
post_onebox_maxlength: 200
read_time_word_count: 350
# keep the slug ascii: mixed CN/EN titles get readable slugs, pure-Chinese titles degrade to "topic" (access unaffected)
slug_generation_method: "ascii"

# ── Access and signup ────────────────────────────────────────────────────────
# the App's logged-out browsing relies on public access; do not enable login_required
login_required: false
invite_only: false
must_approve_users: false
enable_local_logins: true
enable_signup_cta: true
# keep usernames ASCII (@mentions and links stay stable); display names may be Chinese
unicode_usernames: false
full_name_requirement: optional_at_signup
prioritize_username_in_ux: false
# max new accounts per IP per day. Mobile networks in China share egress IPs heavily (CGNAT):
# too low hits real users, too high lets bulk registration through; start at 5 and watch
max_new_accounts_per_registration_ip: 5

# ── dsh-go App login (User API Key) ──────────────────────────────────────────
# The App opens /user-api-key/new with parameters:
#   application_name=dsh-go  scopes=read,write,notifications,session_info
#   auth_redirect=dshgo://forum/auth  padding=oaep
# auth_redirect must match the entry below exactly (including having no query parameters).
allowed_user_api_auth_redirects:
  add:
    - "dshgo://forum/auth"
# the default already contains read|write|message_bus|push|notifications|session_info|one_time_password;
# use add so the four scopes the App needs are definitely present
allow_user_api_key_scopes:
  add: [read, write, notifications, session_info]
# default 1|2|10: trust-level-0 new users can also log into the App. Do not tighten, or fresh signups cannot use the App
user_api_key_allowed_groups: "1|2|10"
# App logins unused for 180 days are revoked automatically (the default)
revoke_user_api_keys_unused_days: 180

# ── dsh-go share links in posts ──────────────────────────────────────────────
# without this entry, dshgo://share/… links lose their href to Discourse's HTML sanitizer
allowed_href_schemes:
  add: [dshgo]

# ── Third-party login: LINUX DO (built-in discourse-openid-connect) ────────────
# endpoints and scopes come from connect.linux.do's OIDC discovery document (verified reachable 2026-10)
openid_connect_discovery_document: "https://connect.linux.do/.well-known/openid-configuration"
openid_connect_authorize_scope: "openid profile email"
# LINUX DO does not return email_verified, keep false: first-time logins must confirm email once,
# and accounts are never auto-merged by email address (prevents impersonation)
openid_connect_email_verified_claim_fallback: false
# let existing accounts bind / unbind LINUX DO in their user preferences
openid_connect_allow_association_change: true
# turn on temporarily when login fails; the logs then show the full OIDC exchange
openid_connect_verbose_logging: false

# ── Third-party login: Gitee (built-in discourse-oauth2-basic) ────────────────
oauth2_authorize_url: "https://gitee.com/oauth/authorize"
oauth2_token_url: "https://gitee.com/oauth/token"
oauth2_token_url_method: "POST"
# Gitee takes the access_token in a query parameter (:token is substituted by the plugin)
oauth2_user_json_url: "https://gitee.com/api/v5/user?access_token=:token"
oauth2_user_json_url_method: "GET"
oauth2_json_user_id_path: "id"
oauth2_json_username_path: "login"
oauth2_json_name_path: "name"
# Gitee only returns the email the user made public and often none; when empty, Discourse asks the user to enter and verify it
oauth2_json_email_path: "email"
oauth2_json_avatar_path: "avatar_url"
oauth2_email_verified: false
oauth2_scope: "user_info"
# send client_secret only in the request body (per Gitee's docs), not also as a Basic header
oauth2_send_auth_header: false
oauth2_send_auth_body: true
oauth2_button_title: "Gitee"
oauth2_allow_association_change: true
oauth2_debug_auth: false

# ── Trust levels (new community: lower the bars so real people can post normally quickly) ──
default_trust_level: 0
# to reach TL1: enter 3 topics, read 15 posts, spend 5 minutes total (official defaults 5 / 30 / 10)
tl1_requires_topics_entered: 3
tl1_requires_read_posts: 15
tl1_requires_time_spent_mins: 5
# TL2 keeps the official defaults (15 days of sustained engagement); it unlocks invites and more

# ── New user (trust level 0) limits and anti-spam ────────────────────────────
# sharing plugins and configs often needs links, so level 0 gets 3 links per post (default 2)
newuser_max_links: 3
newuser_max_embedded_media: 5
newuser_max_attachments: 0
newuser_max_mentions_per_post: 2
newuser_max_replies_per_topic: 3
# a new user posting the same external host 3 times is judged spammy (the default)
newuser_spam_host_threshold: 3
max_topics_in_first_day: 3
max_replies_in_first_day: 10
# a first post typed too fast (script-paste-like) is auto-silenced pending review (on by default)
auto_silence_fast_typers_on_first_post: true
# new accounts from the same IP replying to each other get auto-flagged (sock-puppet detection)
flag_sockpuppets: true
# 3 distinct flags silence the new user (default)
num_users_to_silence_new_user: 3
# the default 1|2|10 means no post pre-moderation for anyone; keep it at launch.
# during a spam wave switch to "1|2|11": level-0 users' posts go to the approval queue first
approve_unless_allowed_groups: "1|2|10"
approve_new_topics_unless_allowed_groups: "1|2|10"
# personal messages for level 1 and up only (default), reduces PM spam
personal_message_enabled_groups: "1|2|11"
# invites for level 2 and up only (default)
invite_allowed_groups: "1|2|12"

# ── Tags ──────────────────────────────────────────────────────────────────────
tagging_enabled: true
max_tags_per_topic: 3
# only level 3 and moderators may create tags; everyone else picks from existing ones (default)
create_tag_allowed_groups: "1|2|13"
tag_topic_allowed_groups: "1|2|10"

# ── Content and UI ────────────────────────────────────────────────────────────
allow_uncategorized_topics: false
# categories keep the fixed order from community.yml's position (otherwise they sort by activity)
fixed_category_positions: true
top_menu: "latest|new|top|categories"
desktop_category_page_style: "categories_and_latest_topics"
# the App has no chat support; keep it off on web too, one less surface to patrol
chat_enabled: false
# the help category can mark "solved" (built-in discourse-solved; enabled per category in community.yml)
solved_enabled: true
# uploads: images up to 10 MB (default), images only
authorized_extensions: "jpg|jpeg|png|gif|webp|avif|heic|heif"
max_image_size_kb: 10240

# ── Backups ───────────────────────────────────────────────────────────────────
enable_backups: true
# once a day, keep 7; stored under /var/discourse/shared/standalone/backups/default
backup_frequency: 1
maximum_backups: 7
backup_with_uploads: true
# to move backups to object storage: change the next line to s3 and fill the S3 entries in secrets.yml
backup_location: "local"
